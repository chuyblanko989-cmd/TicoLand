<!DOCTYPE html>
<html lang="es">
<head>

<title>TiCoLand (isometrico)</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Nunito:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;font-family:Nunito,sans-serif}

#msg{position:absolute;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 120px);transform:translate(-50%,10px);max-width:min(90vw,520px);background:#1b1208ee;color:#fff3d6;border:2px solid #e8c882;border-radius:14px;padding:.8rem 1.1rem;font-size:1rem;text-align:center;opacity:0;transition:.3s}

#act{position:absolute;right:28px;bottom:calc(max(36px,env(safe-area-inset-bottom)));width:92px;height:92px;border-radius:50%;background:#d8452fcc;border:3px solid #fff;color:#fff;font:700 .95rem Nunito;pointer-events:auto;display:none}
#act:active{transform:scale(.9)}
#coins{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;background:#1b1208dd;color:#ffe08a;border:2px solid #e8c882;border-radius:20px;padding:.35rem .85rem;font-size:1.05rem}
#shop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,380px);max-height:72vh;overflow:auto;touch-action:pan-y;background:#2a1a0c;color:#fff3d6;border:3px solid #e8c882;border-radius:16px;padding:1rem;display:none;pointer-events:auto;text-align:center}

#shop h2{margin:0;font-size:1.2rem}#shop small{color:#e8c882}

#shop .it:active{transform:scale(.97)}

#shut{margin-top:.5rem;background:#d8452f;color:#fff;border:0;border-radius:10px;padding:.6rem 1.4rem;font:700 1rem Nunito}
#hpbox{position:absolute;top:calc(max(12px,env(safe-area-inset-top)) + 48px);left:12px;display:flex;align-items:center;gap:.4rem;background:#1b1208dd;border:2px solid #e8c882;border-radius:20px;padding:.25rem .7rem;color:#fff3d6;font-size:.95rem}
#hpb{width:120px;height:12px;background:#4a1a14;border-radius:8px;overflow:hidden}
#hpf{display:block;height:100%;width:100%;background:linear-gradient(#ff6a5a,#d11f2a);transition:width .25s}
#hpbox.low #hpf{background:linear-gradient(#ffb04a,#e86a1a)}
#fish{position:absolute;right:28px;bottom:calc(max(36px,env(safe-area-inset-bottom)));min-width:96px;height:56px;padding:0 1rem;border-radius:28px;background:#1f7fb0;border:3px solid #fff;color:#fff;font:800 .95rem Nunito;pointer-events:auto;display:none}
#fish.on{display:block}.touch #fish{bottom:calc(max(36px,env(safe-area-inset-bottom)) + 108px)}
#clock{position:absolute;top:calc(max(12px,env(safe-area-inset-top)) + 92px);left:12px;background:#1b1208dd;color:#fff3d6;border:2px solid #e8c882;border-radius:20px;padding:.25rem .8rem;font-size:.95rem}
#gear{position:absolute;top:calc(max(12px,env(safe-area-inset-top)) + 138px);right:12px;width:44px;height:44px;border-radius:50%;background:#1b1208dd;border:2px solid #e8c882;font-size:1.3rem;pointer-events:auto;color:#fff}
#set{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,340px);background:#2a1a0c;color:#fff3d6;border:3px solid #e8c882;border-radius:16px;padding:1rem;display:none;pointer-events:auto;text-align:center}
#set.on{display:block}#set h2{margin:0 0 .5rem}#set button{display:block;width:100%;margin-top:.5rem;padding:.7rem;border-radius:10px;border:1px solid #e8c882;background:#4a2f17;color:#fff3d6;font:700 1rem Nunito}
#set #svb{background:#2f8f4e}#set #delb{background:#7a2a1f}#setstat{margin-top:.6rem;color:#9ad6a0;min-height:1.2em;font-size:.9rem}
#bagb{position:absolute;top:calc(max(12px,env(safe-area-inset-top)) + 138px);right:64px;width:44px;height:44px;border-radius:50%;background:#1b1208dd;border:2px solid #e8c882;font-size:1.3rem;pointer-events:auto;color:#fff}
#tbar{position:absolute;top:calc(max(12px,env(safe-area-inset-top)) + 130px);left:12px;display:none;align-items:center;gap:.4rem;background:#1b1208dd;border:2px solid #e8c882;border-radius:20px;padding:.25rem .7rem;color:#fff3d6;font-size:.85rem}
#tbar.on{display:flex}#tb{width:80px;height:10px;background:#3a2a14;border-radius:6px;overflow:hidden}#tbf{display:block;height:100%}
#compass{position:absolute;top:calc(max(12px,env(safe-area-inset-top)) + 170px);left:12px;display:none;background:#1b1208dd;border:2px solid #e8c882;border-radius:20px;padding:.25rem .7rem;color:#fff3d6;font-size:.85rem}#compass.on{display:block}#carr{display:inline-block}
.dur{height:8px;background:#3a2a14;border-radius:5px;overflow:hidden;margin-top:4px;width:100%}.dur i{display:block;height:100%}
#jbtn{position:absolute;top:calc(max(12px,env(safe-area-inset-top)) + 138px);right:116px;width:44px;height:44px;border-radius:50%;background:#1b1208dd;border:2px solid #e8c882;font-size:1.3rem;pointer-events:auto;color:#fff;display:none}

#dlg.on{display:block}#dlg h2{margin:0 0 .5rem;font-size:1.1rem;color:#ffe08a}#dlg p{margin:.2rem 0 .6rem;line-height:1.4;font-size:.98rem}
#dlg button{display:block;width:100%;margin-top:.45rem;padding:.65rem;border-radius:10px;border:1px solid #e8c882;background:#4a2f17;color:#fff3d6;font:700 .95rem Nunito}
.touch #joy,.touch #act{display:block}

/* --- animaciones --- */
@keyframes popIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.82)}60%{transform:translate(-50%,-50%) scale(1.04)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes msgIn{0%{transform:translate(-50%,24px) scale(.9)}55%{transform:translate(-50%,-6px) scale(1.04)}100%{transform:translate(-50%,0) scale(1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ffffff66}50%{box-shadow:0 0 0 12px #ffffff00}}
@keyframes bnr{0%{opacity:0;transform:translate(-50%,-50%) scale(.6);letter-spacing:.6em}20%{opacity:1;transform:translate(-50%,-50%) scale(1);letter-spacing:.12em}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1.08)}}
@keyframes heart{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes spinIn{from{transform:rotate(-180deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
#msg.on{animation:msgIn .45s cubic-bezier(.2,.9,.3,1.2)}
#shop.on,#dlg.on,#set.on{animation:popIn .32s cubic-bezier(.2,.9,.3,1.2)}
#shop .it,#dlg button,#set button{transition:transform .12s,background .15s}
#shop .it:hover,#dlg button:hover,#set button:hover{background:#6a431f;transform:translateY(-2px)}
#coins.bump{animation:bump .35s}#clock.bump{animation:bump .6s}
#hpbox.hit{animation:shake .35s}#hpbox span{display:inline-block;animation:heart 1.2s ease-in-out infinite}#hpbox.low span{animation-duration:.45s}
#act,#fish{animation:pulse 1.8s ease-in-out infinite}
#gear,#bagb,#jbtn{transition:transform .2s}#gear:active{transform:rotate(90deg) scale(.9)}#bagb:active,#jbtn:active{transform:scale(.88)}
#carr{transition:transform .2s}
#bnr{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);color:#fff;font:700 clamp(1.6rem,6vw,3rem) 'Cinzel Decorative',Georgia,serif;text-shadow:0 0 14px #000,0 0 28px #000;opacity:0;pointer-events:none;white-space:nowrap}
#bnr.on{animation:bnr 3s ease-out forwards}
#rot{position:fixed;inset:0;background:#000;color:#fff;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center;font:700 1.15rem Nunito,sans-serif;padding:2rem}
#rot i{font-style:normal;font-size:4rem;display:inline-block;animation:rotp 2.4s ease-in-out infinite}
@keyframes rotp{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){.touch #rot.need{display:flex}}
/* --- horizontal --- */
@media (orientation:landscape) and (max-height:520px){
#mini{width:96px;height:96px;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right))}
#gear,#bagb,#jbtn{top:calc(max(8px,env(safe-area-inset-top)) + 104px);width:38px;height:38px;font-size:1.1rem}
#gear{right:max(8px,env(safe-area-inset-right))}#bagb{right:calc(max(8px,env(safe-area-inset-right)) + 46px)}#jbtn{right:calc(max(8px,env(safe-area-inset-right)) + 92px)}
#coins,#hpbox,#clock,#tbar,#compass{left:max(8px,env(safe-area-inset-left));font-size:.8rem}
#coins{top:max(8px,env(safe-area-inset-top));padding:.2rem .7rem}
#hpbox{top:calc(max(8px,env(safe-area-inset-top)) + 34px);padding:.15rem .6rem}#hpb{width:90px}
#clock{top:calc(max(8px,env(safe-area-inset-top)) + 68px);padding:.15rem .6rem}
#tbar{top:calc(max(8px,env(safe-area-inset-top)) + 100px)}#compass{top:calc(max(8px,env(safe-area-inset-top)) + 130px)}
#joy{left:max(24px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:112px;height:112px}#knob{left:26px;top:26px}
#act{right:max(28px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:84px;height:84px}
.touch #fish{right:calc(max(28px,env(safe-area-inset-right)) + 96px);bottom:max(26px,env(safe-area-inset-bottom))}
#msg{bottom:max(10px,env(safe-area-inset-bottom));max-width:min(56vw,520px);font-size:.9rem;padding:.5rem .9rem}
#shop,#dlg{max-height:88vh;width:min(70vw,460px)}#set{width:min(60vw,340px)}
}
@media (max-height:460px){
#mini{width:92px!important;height:92px!important;border-width:2px!important}
#coins,#hpbox,#clock,#tbar{transform:scale(.8);transform-origin:left top}
#gear{top:calc(max(8px,env(safe-area-inset-top)) + 100px)!important;width:38px!important;height:38px!important;font-size:1.1rem!important}
#bagb{top:calc(max(8px,env(safe-area-inset-top)) + 100px)!important;right:56px!important;width:38px!important;height:38px!important;font-size:1.1rem!important}
#joy{bottom:8px!important;left:14px!important}
#act{width:74px!important;height:74px!important;bottom:10px!important;right:16px!important;font-size:.8rem!important}
#fish{bottom:92px!important;right:16px!important}.touch #fish{bottom:92px!important}
#hud>button[style*="8e44ad"]{width:54px!important;height:54px!important;bottom:10px!important;right:100px!important}
#hud>button[style*="e8a020"]{width:54px!important;height:54px!important;bottom:70px!important;right:100px!important}
}
</style>

<body>
<canvas id="g"></canvas><div id="rot"><i>📱</i><span>Gira tu teléfono<br>TiCoLand se juega en horizontal</span></div>
<div id="hud"><canvas id="mini" width="260" height="260"></canvas><div id="msg"></div><div id="bnr"></div><div id="coins">🪙 ₡0</div><div id="hpbox"><span>❤️</span><div id="hpb"><i id="hpf"></i></div><b id="hpn">100</b></div><div id="clock">☀️ Día</div><div id="tbar"><span id="tname"></span><div id="tb"><i id="tbf"></i></div></div><div id="compass"><span id="carr">➤</span> Mina</div>
<div id="joy"><div id="knob"></div></div><button id="act">ACCION</button><button id="fish">PESCAR 🎣</button><div id="shop"><h2>Pulpería Don Pura Vida</h2><small>La más famosa de Costa Rica · pesca y carnada</small><div id="items"></div><div id="wal"></div><div id="sstat"></div><button id="shut">Cerrar</button></div><button id="gear">⚙️</button><button id="bagb">🎒</button><button id="jbtn">📖</button><div id="dlg"><h2 id="dh"></h2><p id="dtx"></p><div id="db"></div></div><div id="set"><h2>⚙️ Ajustes</h2><button id="svb">💾 Guardar partida</button><button id="delb">🗑️ Borrar partida y reiniciar</button><button id="setx">Cerrar</button><div id="setstat">Se guarda sola cada 30 s.</div></div></div>
<div id="intro"><h1>TiCoLand</h1><button id="start">PRESIONA PARA EXPLORAR</button></div>
<script>
let started=false;
const S={act:0,clues:{},order:[],choices:{},heard:0,contam:0,kx:0,ky:0,sealed:0,sacoFree:0,suspect:0,ending:'',samples:0,rumors:0,guide:{},colgante:0,zs:{}};

(()=>{
const W=3000,H=2200,cv=document.getElementById('g'),cx=cv.getContext('2d'),mm=document.getElementById('mini'),mx=mm.getContext('2d');
let VW,VH,DPR;
function rs(){DPR=Math.min(devicePixelRatio||1,2);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR}
addEventListener('resize',rs);rs();
const isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
if(isTouch)document.body.classList.add('touch');
// seeded random
let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
const rr=(a,b)=>a+rnd()*(b-a);
// island shape (ellipse w/ wobble)
const IC={x:1500,y:1100,rx:1380,ry:980};
const wob=a=>1+.05*Math.sin(a*3)+.04*Math.sin(a*5+1);
function inIsland(x,y){const dx=(x-IC.x)/IC.rx,dy=(y-IC.y)/IC.ry,a=Math.atan2(dy,dx);return Math.hypot(dx,dy)<.92*wob(a)}
const LAKE={x:1250,y:1180,rx:380,ry:230};
const inLake=(x,y,m=0)=>(((x-LAKE.x)/(LAKE.rx+m))**2+((y-LAKE.y)/(LAKE.ry+m))**2)<1;
const RUINS={x:2480,y:640};
const DOCK={x:LAKE.x-LAKE.rx-10,y:LAKE.y,w:120,h:40};
const MOUNT={x:1600,y:420,r:420}; // high zone
const inMount=(x,y)=>Math.hypot(x-MOUNT.x,y-MOUNT.y)<MOUNT.r;
// state
const P={x:DOCK.x-120,y:DOCK.y+80,dir:2,fr:0,mv:0,boat:false,vx:0,vy:0,ang:0,sp:0};
const boat={x:DOCK.x+60,y:DOCK.y+4,ang:0};
// world objects
const solids=[];// {x,y,r}
const trees=[],houses=[],bushes=[],animals=[],npcs=[],rocks=[];
function free(x,y,m=0){return inIsland(x,y)&&!inLake(x,y,m+30)&&Math.hypot(x-RUINS.x,y-RUINS.y)>260&&!nearRoad(x,y,48+m)}
function place(n,fn,mind=70){let t=0,c=0;while(c<n&&t++<4000){const x=rr(150,W-150),y=rr(150,H-150);if(!free(x,y,20))continue;if(solids.some(s=>Math.hypot(s.x-x,s.y-y)<mind+s.r))continue;fn(x,y);c++}}
const SHOP={x:760,y:780};solids.push({x:SHOP.x,y:SHOP.y,r:70});
const HOME={x:560,y:1340,k:2,own:1},CHURCH={x:1500,y:1720};
const SHIP=(()=>{const a=2.45,f=wob(a)*.93;return{x:IC.x+Math.cos(a)*IC.rx*f,y:IC.y+Math.sin(a)*IC.ry*f}})();solids.push({x:SHIP.x,y:SHIP.y,r:75});
const CAVE={x:1300,y:380},MINE={x:2100,y:450};solids.push({x:CAVE.x,y:CAVE.y,r:80},{x:MINE.x,y:MINE.y,r:70});
const SHL=[
{key:'pulp',x:SHOP.x,y:SHOP.y,col:'#ffc400',wall:'#a8703a',roof:'#b8352a',a1:'#fff',a2:'#2f8f4e',t:'PULPERÍA DON PURA VIDA',s:'La más famosa de Costa Rica'},
{key:'pawn',x:1020,y:600,col:'#e0e0ff',wall:'#6b5a7b',roof:'#2e2a45',a1:'#e8b923',a2:'#2e2a45',t:'EMPEÑOS EL TESORO',s:'Joyas, herramientas y reliquias'},
{key:'food',x:1750,y:980,col:'#ff7a2a',wall:'#d9b98a',roof:'#c94a2a',a1:'#fff',a2:'#d8452f',t:'SODA DOÑA LUPE',s:'Comida típica tica'}];
solids.push({x:HOME.x,y:HOME.y,r:60},{x:CHURCH.x,y:CHURCH.y,r:70},{x:SHL[1].x,y:SHL[1].y,r:70},{x:SHL[2].x,y:SHL[2].y,r:70});houses.push(HOME);
const ROAD=[[560,1440],[720,1400],[800,1240],[790,1060],[780,880],[1020,700],[1500,700],[1900,780],[1900,1000],[1750,1130],[1800,1620],[1500,1830],[1100,1700],[700,1560]].map(([x,y])=>({x,y}));
function nearRoad(x,y,m){for(let i=0;i<ROAD.length;i++){const a=ROAD[i],b=ROAD[(i+1)%ROAD.length],dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy)));if(Math.hypot(x-(a.x+dx*t),y-(a.y+dy*t))<m)return true}return false}
// houses first
place(8,(x,y)=>{houses.push({x,y,k:rnd()<.5?0:1});solids.push({x,y,r:60})},260);
// trees
place(70,(x,y)=>{const m=inMount(x,y);const k=m?0:rnd()<.5?1:0;const t={x,y,k,ph:rnd()*6,hive:!m&&rnd()<.14,monkey:m&&rnd()<.5,mt:rnd()*10};trees.push(t);solids.push({x,y,r:16})},80);
for(let i=0,c=0;c<9&&i<999;i++){const a=rnd()*6.28,d=rr(60,MOUNT.r-40),x=MOUNT.x+Math.cos(a)*d,y=MOUNT.y+Math.sin(a)*d;if(!inIsland(x,y)||solids.some(s=>Math.hypot(s.x-x,s.y-y)<80+s.r))continue;trees.push({x,y,k:0,ph:rnd()*6,hive:false,monkey:false,mt:0});solids.push({x,y,r:16});c++}
const mTrees=trees.filter(t=>t.k===0&&inMount(t.x,t.y)),monkeys=[];
mTrees.slice(0,7).forEach((t,i)=>monkeys.push({t,to:t,from:{x:0,y:0},st:'sit',tm:rr(1,4),j:0,x:t.x,y:t.y-66,ph:rnd()*6,face:i%2?-1:1,fur:i%2?'#5b3a1e':'#7a4a24'}));
const perch=(t,m)=>({x:t.x+(m.ph%1)*22-11+Math.sin(T*1.3+t.ph)*3,y:t.y-66});
// banana & bushes (non-solid)
place(28,(x,y)=>bushes.push({x,y,k:rnd()<.4?1:0,ph:rnd()*6}),40);
// rocks around ruins
for(let i=0;i<26;i++){const a=rnd()*6.28,d=rr(50,230);rocks.push({x:RUINS.x+Math.cos(a)*d,y:RUINS.y+Math.sin(a)*d,s:rr(14,38),a:rnd()*6})}

function objective(){
 if(S.ending)return 'Historia concluida: «'+({combate:'Final de combate',revelacion:'Final de revelación',secreto:'Final secreto'}[S.ending])+'». Sigue explorando la isla.';
 if(!has0('panuelo')||!has0('huellas1'))return 'Examina las huellas y el pañuelo donde se llevaron a Beto.';

 if(!has0('diario1'))return 'La llave tiene un 7. Busca la casa del capataz (al oeste) cerrada con candado.';

 if(S.choices.invest==='invest'&&!knowsTruth())return 'Reúne pruebas: el plano (baúl del capataz), una muestra de un charco verde (necesitas una cubeta) y rastros de la criatura. La verdad está bajo la cruz...';

 if(has0('huellas1')&&has0('panuelo'))D.push('Beto dejó señales: sigue vivo.');

 if(rcount()>=1&&has0('muestra'))D.push('Algo envenena el agua del arroyo. La criatura de las fincas persigue a los animales enfermos.');
 if(has0('muestra'))D.push('El verdín se parece a la esmeralda y al jade de la mina. Cuanto más picas, más lobos zombis aparecen.');
 if(dcount()>=2)D.push('Hace cuarenta años pasó algo en la veta del Remanso, y alguien lo encubrió.');
 if(has0('foto'))D.push('El sombrero del capataz Eusebio es idéntico al del Hombre del Saco.');

 if(S.colgante)D.push('Canelo era el perro de Eusebio. ¿Y si el Cadejos...?');
 return D}

 const D=deductions();if(D.length)h+='<div style="text-align:left;margin-top:.6rem;color:#9ad6a0"><b>Deducciones</b><br>'+D.map(x=>'• '+x).join('<br>')+'</div>';

 if(ch.length)h+='<div style="text-align:left;margin-top:.6rem;color:#e8c882"><b>Tus decisiones</b><br>'+ch.map(x=>'• '+x).join('<br>')+'</div>';
 itEl.innerHTML=h;document.getElementById('wal').textContent='Pistas: '+S.order.length+'  ·  Diarios: '+dcount()+'/4  ·  Contaminación: '+S.contam}

 if(S.act>=1){cad={x:RUINS.x-90,y:RUINS.y+60,fr:0,face:1,mode:'rest',hp:14};beto={x:RUINS.x+60,y:RUINS.y+50,mode:'sleep',dir:2};

function startKidnap(){cut=true;closeShop();S.kx=P.x+90;S.ky=P.y;beto={x:P.x+90,y:P.y+4,mode:'stand',dir:1};cad={x:P.x+560,y:P.y+34,fr:0,face:-1,mode:'run',hp:14};kid={t:0,ph:0};say('Beto: —¡Oye! ¿Oíste eso? Algo viene entre los árboles...',3.5)}
function updKid(dt){const k=kid;k.t+=dt;
 if(k.ph===0){if(k.t>1.6){cad.x-=250*dt;cad.fr+=dt*16;if(cad.x<=beto.x+34){k.ph=1;k.t0=k.t;beto.mode='carried';S.kx=cad.x-20;S.ky=cad.y;cad.face=-1;say('¡¡Beto!!',2)}}}
 else if(k.ph===1){beto.x=cad.x;beto.y=cad.y;if(k.t-k.t0>2){k.ph=2;k.t1=k.t;cad.face=1;say('El Cadejos te mira con ojos rojos... y no te ataca. Se lleva a Beto con vida. ¿Por qué no lo mató?',6)}}
 else{cad.x+=300*dt;cad.fr+=dt*16;beto.x=cad.x;beto.y=cad.y;if(k.t-k.t1>2.4){cad.x=RUINS.x-90;cad.y=RUINS.y+60;cad.mode='rest';cad.face=1;beto.mode='sleep';beto.x=RUINS.x+60;beto.y=RUINS.y+50;kid=null;cut=false;S.act=1;say('Busca las huellas y lo que dejaron atrás. Abre tu 📖 Diario (tecla J).',6)}}}
function updCad(dt){if(!cad)return;cad.cd-=dt;
 if(cad.mode==='fight'){const dx=P.x-cad.x,dy=P.y-cad.y,d=Math.hypot(dx,dy)||1;cad.face=dx>=0?1:-1;cad.fr+=dt*14;if(d>34){cad.x+=dx/d*150*dt;cad.y+=dy/d*150*dt}else if(cad.cd<=0&&!inside){cad.cd=1.5;dmg(10)}}}
function spawnZW(x,y,n){for(let i=0;i<n;i++)zws.push({x:x+rr(-30,30),y:y+rr(-30,30),zone:-1,fr:rnd()*6,cd:0,face:1,hx:x,hy:y,tx:x,ty:y,temp:60})}
function updZW(dt){
 const night=dark>.5&&phase!=='dawn',ok=S.act>=1&&!S.sealed;
 if(ok&&night&&!zwOn){zwOn=true;const per=1+(S.contam>12?1:0)+(S.contam>30?1:0);ZONES.forEach((z,i)=>{for(let k=0;k<per;k++)zws.push({x:z.x+rr(-90,90),y:z.y+rr(-60,60),zone:i,fr:rnd()*6,cd:0,face:1,hx:z.x,hy:z.y,tx:z.x,ty:z.y,temp:0})});say('Gruñidos podridos desde los charcos verdes... lobos zombis.',4)}
 if(zwOn&&(!night||!ok)){zwOn=false;for(let i=zws.length-1;i>=0;i--)if(!zws[i].temp)zws.splice(i,1)}
 const pw=wp(),torch=hasT()&&dark>.15&&!inside;
 for(let i=zws.length-1;i>=0;i--){const z=zws[i];z.cd-=dt;if(z.temp){z.temp-=dt;if(z.temp<=0){zws.splice(i,1);continue}}
  const dp=Math.hypot(pw.x-z.x,pw.y-z.y);let tx=z.tx,ty=z.ty,sp=40;
  if(torch&&dp<240){tx=z.x+(z.x-pw.x);ty=z.y+(z.y-pw.y);sp=120}
  else if(!inside&&!P.boat&&!cut&&!bagSeq&&dp<(z.temp?460:300)){tx=pw.x;ty=pw.y;sp=94;if(dp<20&&z.cd<=0&&sl.st===''){z.cd=1.2;dmg(5)}}
  else if(Math.hypot(z.tx-z.x,z.ty-z.y)<12){z.tx=z.hx+rr(-170,170);z.ty=z.hy+rr(-110,110)}
  const dx=tx-z.x,dy=ty-z.y,d=Math.hypot(dx,dy)||1,nx=z.x+dx/d*sp*dt,ny=z.y+dy/d*sp*dt;if(inIsland(nx,ny)&&!inLake(nx,ny,0)){z.x=nx;z.y=ny}else{z.tx=z.x;z.ty=z.y}z.fr+=dt*sp/8;if(Math.abs(dx)>2)z.face=dx>=0?1:-1}}
function storyTick(dt){
 jbE.style.display=S.act>=1?'block':'none';
 if(S.act===0&&!kid&&dark>.75&&phase!=='dawn'&&!inside&&!P.boat&&!bagSeq&&!sl.st&&!dlgOpen&&!shopOpen&&!setOpen&&!cut)startKidnap();
 if(kid)updKid(dt);
 if(S.act>=1){updCad(dt);
  if(!glimpse&&!S.sealed&&dark>.5&&!inside&&!P.boat&&!cut&&!dlgOpen)ZONES.forEach((z,i)=>{if(!glimpse&&!S.guide[i]&&Math.hypot(z.x-P.x,z.y-P.y)<150){S.guide[i]=1;const a=Math.atan2(z.y-P.y,z.x-P.x);glimpse={x:P.x+Math.cos(a)*110,y:P.y+Math.sin(a)*110,fr:0,face:Math.cos(a)>=0?-1:1,t:0};say('Un gruñido grave... el Cadejos se interpone entre tú y el charco.',4);addClue('guia')}});
  if(glimpse){glimpse.t+=dt;if(glimpse.t>4){glimpse.x+=300*dt;glimpse.fr+=dt*16;glimpse.face=1}if(glimpse.t>6)glimpse=null}
  if(!S.ending&&!dlgOpen&&!cut&&!fightOn&&!inside&&!bagSeq){const d=Math.hypot(RUINS.x-P.x,RUINS.y-P.y);if(d<170&&!finAsk)finale();else if(d>320)finAsk=false}}
 updZW(dt)}

 const txt='Junto al huevo tibio, Beto duerme pálido, con venas verdes en el cuello. El Cadejos se alza sobre él, gruñendo, con ojos rojos que a ratos parecen azules.'+(has0('perseguido')||has0('huellas1')?' Notas que cojea: tiene viejas marcas de mordidas.':'')+(S.suspect?' Recuerdas el susurro: «Tu amigo ya no es tu amigo...»':'');

const TLC=[{n:'Juan Santamaría',r:'Héroe nacional',hp:120,st:90,sp:95,ab:'Antorcha heroica (escudo 5s)',k:'shield',d:TLD.juan},
{n:'Óscar Arias',r:'Estadista y Nobel',hp:90,st:80,sp:95,ab:'Negociador (+30 vida)',k:'heal',d:TLD.oscar},
{n:'El Porcionzón',r:'Cómico legendario',hp:100,st:120,sp:80,ab:'Chiste salvador (escudo 3s + sed)',k:'joke',d:TLD.porci},
{n:'El Galán',r:'Comediante carismático',hp:85,st:100,sp:115,ab:'Encanto veloz (+40% velocidad)',k:'boost',d:TLD.galan},
{n:'Lucía',r:'Exploradora y arqueóloga',hp:95,st:110,sp:110,ab:'Ojo de guía (ve de noche)',k:'sight',d:TLD.lucia},
{n:'Laura Chinchilla',r:'Presidenta',hp:100,st:90,sp:95,ab:'Decreto de bienestar (comida y agua)',k:'feed',d:TLD.laura}];
TLC.forEach(c=>{c.im=new Image();c.im.src=c.d.src});
const TL={c:null,hu:100,th:100,st:100,tired:0,run:0,cd:0,boost:0,sight:0,shield:0,wr:0,warn:0,sv:10};
let csOpen=false;const hudE=document.getElementById('hud'),tlc={};
const tlBar=document.createElement('div');
tlBar.style.cssText='position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:none;gap:6px;align-items:center;background:#1b1208dd;border:2px solid #e8c882;border-radius:20px;padding:.25rem .6rem;color:#fff3d6;font-size:.8rem';
tlBar.innerHTML=[['🍗','#e8a33a','hu'],['💧','#3aa0e8','th'],['⚡','#9be83a','st']].map(([a,c,k])=>`<span>${a}</span><i style="display:block;width:46px;height:8px;background:#3a2a14;border-radius:5px;overflow:hidden"><b id="tl_${k}" style="display:block;height:100%;width:100%;background:${c}"></b></i>`).join('');
hudE.appendChild(tlBar);['hu','th','st'].forEach(k=>tlc[k]=document.getElementById('tl_'+k));
function tlBtn(t,css,fn){const b=document.createElement('button');b.style.cssText='position:absolute;width:64px;height:64px;border-radius:50%;border:3px solid #fff;color:#fff;font:800 1.4rem Nunito;pointer-events:auto;display:none;right:128px;'+css;b.textContent=t;
 b.addEventListener('touchstart',e=>{e.preventDefault();fn(1)},{passive:false});b.addEventListener('touchend',e=>{e.preventDefault();fn(0)},{passive:false});
 b.addEventListener('mousedown',()=>fn(1));b.addEventListener('mouseup',()=>fn(0));b.addEventListener('mouseleave',()=>fn(0));hudE.appendChild(b);return b}
const bSk=tlBtn('✨','bottom:max(36px,env(safe-area-inset-bottom));background:#8e44adcc',v=>v&&tlSkill()),
 bRun=tlBtn('🏃','bottom:calc(max(36px,env(safe-area-inset-bottom)) + 76px);background:#e8a020cc',v=>TL.run=v);
addEventListener('keydown',e=>{if(e.key==='Shift')TL.run=1;if(e.key.toLowerCase()==='q'&&!e.repeat)tlSkill()});
addEventListener('keyup',e=>{if(e.key==='Shift')TL.run=0});
function tlDraw(x,y,dir,fr,mv){const c=TL.c,d=c.d;if(dir===1)TL.fl=-1;else if(dir===3)TL.fl=1;
 let f=0;if(mv>.1){if(TL.wr&&d.r)f=1+d.w+Math.floor(fr*1.3)%d.r;else f=1+Math.floor(fr*(TL.wr?1.4:.9))%d.w}
 const s=68/(d.ch-2),w=d.cw*s;sh(x,y+2,16,5);cx.save();cx.translate(x,y);cx.scale(TL.fl||1,1);cx.drawImage(c.im,f*d.cw,0,d.cw,d.ch,-w/2,-(d.ch-1)*s,w,d.ch*s);cx.restore()}
function tlSkill(){const c=TL.c;if(!started||csOpen||!c||TL.cd>0||shopOpen||setOpen||dlgOpen)return;TL.cd=15;const k=c.k;
 if(k==='shield')TL.shield=5;else if(k==='heal'){hp=Math.min(100,hp+30);setHp()}else if(k==='joke'){TL.shield=3;TL.th=Math.min(100,TL.th+25)}
 else if(k==='boost')TL.boost=6;else if(k==='sight')TL.sight=10;
 else{TL.th=Math.min(100,TL.th+30);TL.hu=Math.min(100,TL.hu+30);hp=Math.min(100,hp+15);setHp()}
 say('✨ '+c.ab,2.4)}
const tlSpd=()=>{const c=TL.c;return c?c.sp/95*(TL.wr?1.5:1)*(TL.boost>0?1.4:1)*(TL.tired?.7:1):1},tlHp=()=>TL.c?TL.c.hp:100;
function tlSurv(dt){if(!started||csOpen||!TL.c)return;const c=TL.c;
 for(const k of['cd','boost','sight','shield'])TL[k]=Math.max(0,TL[k]-dt);
 const wr=TL.run&&P.mv>.1&&TL.st>0&&!TL.tired&&!P.boat;TL.wr=wr;
 TL.st=wr?Math.max(0,TL.st-12*dt):Math.min(c.st,TL.st+8*dt);if(TL.st<=0)TL.tired=1;if(TL.st>20)TL.tired=0;
 if(!(sl.st==='in'||sl.st==='fast')){TL.th=Math.max(0,TL.th-.2*dt*(wr?1.6:1));TL.hu=Math.max(0,TL.hu-.13*dt);
  if(!TL.th||!TL.hu){if(hp>1){hp=Math.max(1,hp-.8*dt);setHp()}TL.warn-=dt;if(TL.warn<=0){TL.warn=12;say(!TL.th?'🥵 ¡Tienes mucha sed! Bebe agua en la orilla del lago.':'😩 ¡Tienes hambre! Come en la soda o la pulpería.',3.5)}}
  else if(hp<100&&TL.th>50&&TL.hu>50){hp=Math.min(100,hp+.4*dt);setHp()}}
 for(const k of['hu','th','st']){const w=Math.round(TL[k]/(k==='st'?c.st:100)*100)+'%';if(tlc[k].style.width!==w)tlc[k].style.width=w}
 const bt=TL.cd>0?String(Math.ceil(TL.cd)):'✨';if(bSk.textContent!==bt){bSk.textContent=bt;bSk.style.opacity=TL.cd>0?.55:1}
 TL.sv-=dt;if(TL.sv<=0){TL.sv=10;try{localStorage.setItem('tl_sv',JSON.stringify([TL.hu,TL.th]))}catch(e){}}}
function drawNight(){const d=dark;if(TL.sight>0)dark=d*.35;try{drawNight0()}finally{dark=d}}
const cs=document.createElement('div');
cs.style.cssText='position:fixed;inset:0;z-index:11;background:#000;display:none;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 12px 18px;overflow-y:auto;touch-action:pan-y;color:#fff;font-family:Nunito,sans-serif';
cs.innerHTML='<h2 style="margin:6px 0 12px;font-size:1.4rem">Elige tu investigador</h2><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;width:100%;max-width:760px">'+TLC.map((c,i)=>`<div data-i="${i}" style="background:#111;border:2px solid #333;border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer"><img src="${c.d.por}" style="height:110px;max-width:100%;object-fit:contain"><b>${c.n}</b><br><small style="color:#aaa">${c.r}</small><br><small>❤ ${c.hp} · ⚡ ${c.st} · 🏃 ${c.sp}</small><br><small style="color:#8bc34a">✨ ${c.ab}</small></div>`).join('')+'</div>';
document.body.appendChild(cs);
cs.addEventListener('click',e=>{const d=e.target.closest('[data-i]');if(d)tlPick(+d.dataset.i,0)});
function tlPick(i,silent){const c=TL.c=TLC[i];TL.st=c.st;TL.tired=0;
 if(silent){try{const v=JSON.parse(localStorage.getItem('tl_sv'));if(v){TL.hu=v[0];TL.th=v[1]}}catch(e){}}else{TL.hu=TL.th=100}
 try{localStorage.setItem('tl_char',i)}catch(e){}
 csOpen=false;cs.style.display='none';tlBar.style.display='flex';bSk.style.display=bRun.style.display='block';
 say('Eres '+c.n+'. Shift/🏃 corre · Q/✨ habilidad · interactúa en el lago para beber.',5)}
document.getElementById('start').addEventListener('click',()=>{let i=-1;try{if(localStorage.getItem(SK)!==null&&localStorage.getItem('tl_char')!==null)i=+localStorage.getItem('tl_char')}catch(e){}
 if(TLC[i])tlPick(i,1);else{csOpen=true;cs.style.display='flex'}});
{const b=document.createElement('button'),g=document.getElementById('set');b.textContent='👤 Cambiar personaje';g.insertBefore(b,document.getElementById('setx'));
 b.onclick=()=>{setOpen=false;g.classList.remove('on');csOpen=true;cs.style.display='flex'}}
const _int=interact;interact=function(){if(csOpen)return;
 if(!inside&&!P.boat&&!near(boat,140)&&inLake(P.x,P.y,70)){if(TL.th>=95)say('No tienes sed.',1.8);else{TL.th=Math.min(100,TL.th+45);say('💧 Bebiste agua fresca del lago',2.4)}return}
 _int()};

requestAnimationFrame(loop);
})();
